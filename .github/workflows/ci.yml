name: Node.js Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Generate Docker tags
        id: vars
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ steps.vars.outputs.branch }}

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ec2-key.pem
          chmod 600 ec2-key.pem
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Docker container to EC2
        run: |
          ssh -i ec2-key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << EOF
            sudo docker pull "${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ steps.vars.outputs.sha_short }}"
            sudo docker rm -f nodeapp || true
            sudo docker run -d --name nodeapp --restart unless-stopped -p 3000:3000 "${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ steps.vars.outputs.sha_short }}"
          EOF